user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { 
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Docker Internal DNS Resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security: Hide Nginx Version
    server_tokens off;

    # Logging Format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr latency: $request_time';

    access_log /var/log/nginx/access.log main;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones (Nginx level DDoS protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

    # Upstream Backend Load Balancer Cluster
    upstream backend_cluster {
        least_conn; # Round-robin with least connection optimization
        server backend_1:5000 max_fails=3 fail_timeout=10s;
        server backend_2:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream Frontend Container
    upstream frontend_server {
        server frontend:80;
    }

    # HTTP Server Configuration
    server {
        listen 80;
        server_name gao.noryx.app localhost;

        # Security Headers (OWASP Hardening)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

        # Health Check Endpoint for Load Balancer / Uptime Monitoring
        location /nginx-health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # API Proxy Routing -> Backend Cluster
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90s;
        }

        # Auth Login Specific Proxy with Stricter Rate Limit
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=10 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend Prometheus Metrics Routing (Restricted / Internal)
        location /metrics {
            proxy_pass http://backend_cluster/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend Static Web Server Proxy
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom Error Pages
        error_page 500 502 503 504 /5x.html;
        location = /5x.html {
            root /usr/share/nginx/html;
        }
    }
}
