global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'rice_backend_cluster'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend_1:5000', 'backend_2:5000']
        labels:
          environment: 'production'
          app: 'rice-ecommerce-backend'

  - job_name: 'nginx_lb'
    static_configs:
      - targets: ['nginx_lb:80']
        labels:
          app: 'rice-nginx-lb'
