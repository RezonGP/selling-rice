version: '3.8'

services:
  # Database - MySQL Only (Port 3306)
  mysql:
    image: mysql:8.0
    container_name: rice_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RiceMySQLPass2026!}
      MYSQL_DATABASE: rice_ecommerce
      MYSQL_USER: ${MYSQL_USER:-rice_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-RiceUserPass2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rice_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RiceMySQLPass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Caching & Rate Limiting & Queue - Redis
  redis:
    image: redis:7-alpine
    container_name: rice_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisRiceSecure2026!}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rice_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisRiceSecure2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Cluster Instance 1
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rice_backend_1
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: backend-1
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RiceMySQLPass2026!}
      MYSQL_DATABASE: rice_ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisRiceSecure2026!}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretRiceJWTKey2026ProductionOnly!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-SuperSecretRiceJWTRefreshKey2026!}
      CORS_ORIGIN: http://localhost:80,http://localhost:3000,http://localhost,http://gao.noryx.app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rice_network

  # Backend Cluster Instance 2 (Load Balanced)
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rice_backend_2
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: backend-2
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RiceMySQLPass2026!}
      MYSQL_DATABASE: rice_ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisRiceSecure2026!}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretRiceJWTKey2026ProductionOnly!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-SuperSecretRiceJWTRefreshKey2026!}
      CORS_ORIGIN: http://localhost:80,http://localhost:3000,http://localhost,http://gao.noryx.app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rice_network

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rice_frontend
    restart: always
    networks:
      - rice_network

  # Nginx Reverse Proxy & Load Balancer
  nginx_lb:
    image: nginx:1.25-alpine
    container_name: rice_nginx_lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_1
      - backend_2
      - frontend
    networks:
      - rice_network

volumes:
  mysql_data:
  redis_data:

networks:
  rice_network:
    driver: bridge
