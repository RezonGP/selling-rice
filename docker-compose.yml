version: '3.8'

services:
  # Database - MongoDB
  mongodb:
    image: mongo:6.0
    container_name: rice_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-RicePass2026!}
      MONGO_INITDB_DATABASE: rice_ecommerce
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rice_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Caching & Rate Limiting & Queue - Redis
  redis:
    image: redis:7-alpine
    container_name: rice_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisRiceSecure2026!}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rice_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisRiceSecure2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Cluster Instance 1
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rice_backend_1
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: backend-1
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-RicePass2026!}@mongodb:27017/rice_ecommerce?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisRiceSecure2026!}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretRiceJWTKey2026ProductionOnly!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-SuperSecretRiceJWTRefreshKey2026!}
      CORS_ORIGIN: http://localhost:80,http://localhost:3000,http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rice_network

  # Backend Cluster Instance 2 (Load Balanced)
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rice_backend_2
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: backend-2
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-RicePass2026!}@mongodb:27017/rice_ecommerce?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisRiceSecure2026!}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretRiceJWTKey2026ProductionOnly!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-SuperSecretRiceJWTRefreshKey2026!}
      CORS_ORIGIN: http://localhost:80,http://localhost:3000,http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rice_network

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rice_frontend
    restart: always
    networks:
      - rice_network

  # Nginx Reverse Proxy & Load Balancer
  nginx_lb:
    image: nginx:1.25-alpine
    container_name: rice_nginx_lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_1
      - backend_2
      - frontend
    networks:
      - rice_network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: rice_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - rice_network

  # Monitoring Dashboard - Grafana
  grafana:
    image: grafana/grafana:10.1.0
    container_name: rice_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-AdminGrafana2026!}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - rice_network

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  rice_network:
    driver: bridge
